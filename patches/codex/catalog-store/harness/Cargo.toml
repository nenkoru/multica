[package]
name = "catalog-store-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tracing = "0.1"
http = "1"

[dev-dependencies]
pretty_assertions = "1"
